<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF4DE">
  <title>COME WITH ME</title>
  <style>
    :root{--sun:#F6A623;--turq:#25B8C7;--milk:#FFF4DE;--ink:#171717}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--milk);font-family:"Nunito Sans","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    body{overflow-x:hidden}
    .hero{min-height:100svh;position:relative;overflow:hidden;background:var(--milk)}
    .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
    .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,244,222,.96) 0%,rgba(255,244,222,.80) 25%,rgba(255,244,222,.18) 47%,rgba(255,244,222,0) 66%);pointer-events:none}
    .header{position:relative;z-index:3;height:150px;display:flex;align-items:center;padding:18px clamp(24px,4.8vw,74px)}
    .logo{width:clamp(178px,18vw,278px);height:auto;display:block}
    .copy{position:relative;z-index:3;width:min(650px,44vw);margin-left:clamp(24px,4.8vw,74px);margin-top:clamp(45px,6.5vh,78px)}
    h1{font-size:clamp(31px,3.05vw,47px);line-height:1.12;margin:0 0 34px;font-weight:600;letter-spacing:-.025em;white-space:nowrap}
    .cta{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-width:185px;padding:16px 29px;border-radius:999px;background:var(--turq);color:white;text-decoration:none;font-size:21px;font-weight:800;box-shadow:0 8px 22px rgba(37,184,199,.20);transition:transform .2s ease,box-shadow .2s ease}
    .cta:hover{transform:translateY(-2px);box-shadow:0 11px 27px rgba(37,184,199,.29)}
    .cta:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
    @media(max-width:900px){h1{white-space:normal}}
    @media(max-width:760px){
      .hero{min-height:100svh}
      .scene{object-position:62% center}
      .veil{background:linear-gradient(180deg,rgba(255,244,222,.96) 0%,rgba(255,244,222,.76) 31%,rgba(255,244,222,.08) 58%,rgba(255,244,222,0) 75%)}
      .header{height:auto;padding:18px 20px}
      .logo{width:175px}
      .copy{width:auto;margin:42px 22px 0;max-width:390px}
      h1{font-size:clamp(30px,9vw,42px);line-height:1.12;margin-bottom:28px;font-weight:600;white-space:normal}
      .cta{font-size:19px;min-width:168px;padding:14px 24px}
    }
    @media(prefers-reduced-motion:reduce){.cta{transition:none}}
  </style>
</head>
<body>
  <main class="hero">
    <video class="scene" autoplay muted playsinline preload="auto" poster="" aria-hidden="true">
      <source src="come-with-me-site-1pages.mp4" type="video/mp4">
    </video>
    <div class="veil"></div>
    <header class="header">
      <img class="logo" src="cwm-logo%201756%20%C3%97%201034%20px%20%D0%BF%D1%80%D0%BE%D0%B7%D0%BE%D1%80%D0%B8%D0%B9%20%D1%84%D0%BE%D0%BD.png" alt="COME WITH ME">
    </header>
    <section class="copy">
      <h1>Тут починається пригода.</h1>
      <a class="cta" href="#world" aria-label="Ходімо">Ходімо <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <div id="world" aria-hidden="true"></div>
</body>
</html>
