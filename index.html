<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF4DE">
  <title>COME WITH ME</title>
  <style>
    :root{--sun:#F6A623;--turq:#25B8C7;--milk:#FFF4DE;--ink:#171717}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--milk);font-family:"Nunito Sans","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    body{overflow-x:hidden}
    .hero{min-height:100svh;position:relative;overflow:hidden;background:var(--milk)}
    .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
    .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,244,222,.96) 0%,rgba(255,244,222,.82) 26%,rgba(255,244,222,.22) 48%,rgba(255,244,222,0) 68%);pointer-events:none}
    .header{position:relative;z-index:3;height:132px;display:flex;align-items:center;padding:20px clamp(24px,5vw,76px)}
    .logo{width:clamp(150px,16vw,245px);height:auto;display:block}
    .copy{position:relative;z-index:3;width:min(520px,43vw);margin-left:clamp(24px,5vw,76px);margin-top:clamp(60px,9vh,115px)}
    h1{font-size:clamp(52px,7vw,104px);line-height:.92;margin:0 0 22px;font-weight:900;letter-spacing:-.055em}
    p{font-size:clamp(20px,2vw,30px);line-height:1.3;margin:0 0 34px;font-weight:700;max-width:460px}
    .cta{display:inline-flex;align-items:center;gap:12px;padding:16px 25px;border-radius:999px;background:var(--turq);color:white;text-decoration:none;font-size:21px;font-weight:900;box-shadow:0 8px 24px rgba(37,184,199,.22);transition:transform .2s ease,box-shadow .2s ease}
    .cta:hover{transform:translateY(-2px);box-shadow:0 11px 28px rgba(37,184,199,.3)}
    .cta:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
    @media(max-width:760px){
      .hero{min-height:100svh}
      .scene{object-position:62% center}
      .veil{background:linear-gradient(180deg,rgba(255,244,222,.96) 0%,rgba(255,244,222,.78) 31%,rgba(255,244,222,.08) 58%,rgba(255,244,222,0) 75%)}
      .header{height:auto;padding:18px 20px}
      .logo{width:155px}
      .copy{width:auto;margin:24px 22px 0;max-width:430px}
      h1{font-size:clamp(48px,16vw,74px)}
      p{font-size:20px;max-width:340px}
      .cta{font-size:19px;padding:14px 22px}
    }
    @media(prefers-reduced-motion:reduce){.cta{transition:none}}
  </style>
</head>
<body>
  <main class="hero">
    <video class="scene" autoplay muted playsinline preload="auto" poster="" aria-hidden="true">
      <source src="come-with-me-site-1pages.mp4" type="video/mp4">
    </video>
    <div class="veil"></div>
    <header class="header">
      <img class="logo" src="cwm-logo%201756%20%C3%97%201034%20px%20%D0%BF%D1%80%D0%BE%D0%B7%D0%BE%D1%80%D0%B8%D0%B9%20%D1%84%D0%BE%D0%BD.png" alt="COME WITH ME">
    </header>
    <section class="copy">
      <h1>Ходімо!</h1>
      <p>Тут починається маленька велика пригода.</p>
      <a class="cta" href="#world" aria-label="Увійти у світ Мімі">У світ Мімі <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <div id="world" aria-hidden="true"></div>
</body>
</html>
